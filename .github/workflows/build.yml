name: Build a Release binárky

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Inštalácia Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Inštalácia závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Zostavenie binárky
        run: pyinstaller --onefile --windowed --name efaktury --hidden-import=PIL._tkinter_finder --collect-submodules reportlab main.py

      - name: Premenovanie výstupu (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          mv dist/efaktury release-assets/efaktury-linux

      - name: Premenovanie výstupu (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          Move-Item dist\efaktury.exe release-assets\efaktury-windows.exe

      - name: Uloženie artefaktu
        uses: actions/upload-artifact@v7
        with:
          name: efaktury-${{ runner.os }}
          path: release-assets/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie artefaktov
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publikovanie do GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: release-assets/*
